<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Holgura</title>
  <meta name="description" content="Controla tu mes de nómina a nómina, ahorra sin llegar justo y guarda tus ahorros en huchas.">
  <meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Holgura">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view"></main>

  <nav id="tabbar" hidden>
    <button data-act="tab" data-tab="inicio">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </button>
    <button data-act="tab" data-tab="revisar">
      <svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>
      <span>Revisar</span>
    </button>
    <button data-act="tab" data-tab="huchas">
      <svg viewBox="0 0 24 24"><path d="M5 11a7 6 0 0 1 13-2h2v4h-1.5a7 6 0 0 1-2.5 3v3h-3v-2h-3v2H7v-3.5A6 6 0 0 1 5 11zM10 6.5h4"/></svg>
      <span>Huchas</span>
    </button>
    <button data-act="tab" data-tab="mimes">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Mi mes</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
